name: Engine data tests

# 엔진이 **실데이터**와 맞는지 검증한다. 공개 저장소의 필수 `Unit tests` 잡은
# 서브모듈 없이 돌아(actions/checkout 기본값) `data/`가 없고, 그래서
# liturgical-engine.data.test.js는 거기서 데이터가 없어 건너뛴다(`haveData`).
#
# **왜 pull_request가 아니라 push인가.** 이 잡은 비공개 데이터 저장소를 받으려고
# 배포 키(시크릿)를 쓴다. GitHub는 포크에서 온 PR의 `pull_request` 실행에 시크릿을
# 주지 않으므로, 포크 PR에서는 데이터를 받지 못해 실패한다. 포크 PR에서도 실행하려면
# `pull_request_target`을 써야 하는데, 이 이벤트는 시크릿을 가진 채 실행되어 포크의
# 코드를 실행하면 시크릿이 유출될 수 있다. sync-data.yml이 `workflow_dispatch`로만
# 실행하는 것도 같은 까닭이다. 그래서 이 잡은 **머지 직후 main push**에서 실행한다.
# 머지 전에 막지는 못하지만, 깨진 엔진이 며칠 뒤 상관없는 sync/data-<run_id> PR의
# 실패로 드러나는 것은 막는다. 머지 전에 검증하려면 시크릿 정책을 함께 정해야 한다
# (설계서 §9 미결22).
on:
  push:
    branches: [main]
    paths:
      - 'js/app/liturgical-engine.js'
      - 'js/app/lectionary.js'
      - 'js/app/verse-spec.js'
      - 'js/app/calendar.js'
      - 'js/app/citations.js'
      - 'tests/unit/liturgical-engine.data.test.js'
      - 'tests/unit/liturgical-fixtures.data.test.js'
      - 'tests/unit/lectionary.data.test.js'
      - 'tests/unit/calendar.data.test.js'
      - 'tests/unit/citations.data.test.js'
      - 'tests/fixtures/liturgical/**'
      - '.github/workflows/engine-data.yml'
  workflow_dispatch:

jobs:
  engine-data:
    name: 엔진 ↔ 실데이터
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 클론 절차는 sync-data.yml 과 같다(읽기 전용 배포 키 + 호스트 별칭).
      # audio 는 필요 없어 data 만 받는다.
      - name: data 서브모듈을 배포 키로 클론
        env:
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DATA_DEPLOY_KEY" > ~/.ssh/data_key
          chmod 600 ~/.ssh/data_key
          # 호스트 키는 TLS 로 인증된 경로에서 받는다(ssh-keyscan 은 TOFU 라 위험).
          curl -fsS https://api.github.com/meta \
            | python3 -c "import json,sys; [print('github.com', k) for k in json.load(sys.stdin)['ssh_keys']]" \
            >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'SSHCFG'
          Host github-data
            HostName github.com
            User git
            IdentityFile ~/.ssh/data_key
            IdentitiesOnly yes
          SSHCFG
          git config --global \
            url."git@github-data:anglican-kr/common-bible-data".insteadOf \
            "git@github.com:anglican-kr/common-bible-data"
          git submodule update --init data

      # 픽스처(실제 연도 기대값의 기준)의 전례일 id 가 실데이터에 실재하는지도 여기서만 본다 —
      # 공개 Unit tests 잡은 data/ 가 없어 그 검사를 skip 한다(설계서 §1.4 · 픽스처 README).
      # 전례독서 뷰 모델(ADR-038 §3)의 실데이터 대조도 같은 자리다 — 뷰 상수 ↔ _meta/_vocab,
      # 실제 날짜의 초기 선택 · 색 · 두 독서 나란히, 2025~2027 전수. 교회력 월간 표 모델(ADR-038 §2 A2)도 —
      # 실제 날짜의 칸 이름 · 색 · 전례년 표지, 2025~2027 모든 달, 42칸의 연도 캐시.
      # 엔진 밖이지만 실데이터가 있어야 도는 것도 이 자리다 — 인용 시트가 옮겨 실린 절(ADR-003)을 모두
      # 탐색 범위 안에서 찾는지(citations.data.test.js).
      - name: 엔진 실데이터 테스트 + 픽스처 전례일 id 실재 + 독서 · 교회력 뷰 모델 실데이터 + 인용 시트의 옮겨 실린 절
        run: node --test tests/unit/liturgical-engine.data.test.js tests/unit/liturgical-fixtures.data.test.js tests/unit/lectionary.data.test.js tests/unit/calendar.data.test.js tests/unit/citations.data.test.js
