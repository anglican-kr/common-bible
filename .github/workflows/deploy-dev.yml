name: Deploy dev

# pre-release를 내면 그 태그의 커밋을 dev.anglican.kr에 올린다(ADR-052 §4).
# pre-release는 서버 저장소의 `scripts/prerelease.sh`로 만든다. 그 스크립트가 빌드
# 식별자(`X.Y.Z-<앱 커밋>`)로 태그 이름을 정하고, 여기서는 서버 저장소의
# `deploy.sh dev-ci`가 같은 식별자를 다시 계산해 태그 이름과 다르면 빌드하기 전에 멈춘다.
# 손으로 만든 pre-release가 엉뚱한 빌드를 올리지 않게 하려는 것이다.
#
# **왜 release 이벤트인가.** Release는 저장소에 쓰기 권한이 있는 사람만 만들 수 있다.
# 포크의 PR은 이 워크플로를 실행하지 못하므로 시크릿이 포크 코드에 닿지 않는다.
# 정식 Release(`--prerelease` 없이)는 운영에 낼 때 만드는 것이라 여기서 받지 않는다
# (`prereleased` 형식만). 운영은 지금처럼 사람이 `deploy.sh promote`로 낸다.
#
# 자격증명은 저장소가 아니라 **환경 `dev`** 에 둔다. 환경의 배포 규칙이 태그
# `*.*.*-*`만 받게 해 두면, 다른 이벤트나 브랜치에서는 이 키를 꺼내지 못한다.
#   - DEV_DEPLOY_SSH_KEY: seoul의 deploy-ci 계정 키. 서버의 authorized_keys가
#     `bible-dev-receive`만 실행하게 묶는다. 그 스크립트는 /var/www/dev만 바꾸고,
#     이미 있는 빌드 폴더(운영이 쓰는 것일 수 있다)는 다시 쓰지 않는다.
#   - SERVER_DEPLOY_KEY: 비공개 서버 저장소(common-bible-server)의 읽기 전용 배포 키.
#   - DATA_DEPLOY_KEY: 데이터 서브모듈의 읽기 전용 배포 키(sync-data.yml과 같은 것).
#   - 변수 DEPLOY_SSH_HOST, DEPLOY_SSH_PORT, DEPLOY_SSH_KNOWN_HOSTS: 서버 주소와 포트,
#     호스트 키 한 줄(`[호스트]:포트 ssh-ed25519 …`). 호스트 키를 고정해 두어
#     `ssh-keyscan`처럼 그때 받은 키를 믿지 않는다.
#
# 실패하면 dev.anglican.kr에는 앞 빌드가 남거나(올리기 전 실패), 새 빌드가 올라간 채
# 검증만 실패한다. 뒤의 경우 로그의 안내대로 `deploy.sh rollback dev`를 실행한다.
# 같은 태그를 다시 올리려면 이 실행을 Re-run 한다. Re-run은 태그가 가리키는 커밋의
# 워크플로를 실행하므로, 이 파일을 고친 내용은 그 태그에 적용되지 않는다.

on:
  release:
    types: [prereleased]

permissions:
  contents: read

# 겹친 배포는 차례로 돈다. 늦게 만든 pre-release가 마지막에 dev에 남는다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: dev.anglican.kr에 올리기
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.anglican.kr
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          path: common-bible
          # deploy.sh가 앱 커밋을 찾으려면 전체 기록이, dev에 들어 있는지 보려면
          # origin/dev가 필요하다. 공개 저장소라 받기에 토큰이 필요 없다.
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: SSH 키와 호스트 키
        env:
          DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
          SERVER_DEPLOY_KEY: ${{ secrets.SERVER_DEPLOY_KEY }}
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          for v in DATA_DEPLOY_KEY SERVER_DEPLOY_KEY DEV_DEPLOY_SSH_KEY DEPLOY_SSH_HOST DEPLOY_SSH_PORT DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "::error::환경 dev에 $v 가 없습니다"; exit 1; fi
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DATA_DEPLOY_KEY"    > ~/.ssh/data_key
          printf '%s\n' "$SERVER_DEPLOY_KEY"  > ~/.ssh/server_key
          printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/*_key
          # GitHub 호스트 키는 TLS로 받은 /meta에서(sync-data.yml과 같은 까닭).
          curl -fsS https://api.github.com/meta \
            | python3 -c "import json,sys; [print('github.com', k) for k in json.load(sys.stdin)['ssh_keys']]" \
            >> ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<SSHCFG
          Host github-data
            HostName github.com
            User git
            IdentityFile ~/.ssh/data_key
            IdentitiesOnly yes
          Host github-server
            HostName github.com
            User git
            IdentityFile ~/.ssh/server_key
            IdentitiesOnly yes
          Host seoul-ci
            HostName $DEPLOY_SSH_HOST
            Port $DEPLOY_SSH_PORT
            User deploy-ci
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          SSHCFG

      - name: 데이터 서브모듈과 서버 저장소 받기
        run: |
          # --global이어야 한다. 서브모듈은 따로 실행되는 `git clone`이 받아서 상위 저장소의
          # 로컬 설정(`git -C common-bible config`)을 읽지 않는다(2026-11-28 첫 실행이 이것으로 실패).
          git config --global \
            url."git@github-data:anglican-kr/common-bible-data".insteadOf \
            "git@github.com:anglican-kr/common-bible-data"
          git -C common-bible submodule update --init data
          git clone -q --depth 1 git@github-server:anglican-kr/common-bible-server.git common-bible-server

      - name: deploy.sh dev-ci
        env:
          APP_ROOT: ${{ github.workspace }}/common-bible
          EXPECT_BUILD_ID: ${{ github.event.release.tag_name }}
        run: common-bible-server/scripts/deploy.sh dev-ci
