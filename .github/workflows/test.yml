name: Tests

# Trigger philosophy: avoid running the same workflow twice when a feature
# branch has an open PR. `push` is restricted to `main` (post-merge sanity),
# while every PR run goes through `pull_request`. Branches without a PR
# don't run CI here — open the PR to get coverage.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/unit/*.test.js
      # 타입 검사(ADR-012)도 이 잡에서 돈다 — 브랜치 보호의 필수 검사가 이 잡(「Unit tests」)이라, 여기 두어야
      # 타입 오류가 머지를 막는다. checkJs: true 라 js/ 의 모든 파일을 보고, 아직 고치지 못한 파일만 첫 줄
      # `// @ts-nocheck` 로 빠진다(docs/known-issues.md §7). devDependency 는 typescript 하나 — 설치 스크립트는 돌리지 않는다.
      - name: 타입 검사
        run: |
          npm ci --ignore-scripts
          npm run typecheck
