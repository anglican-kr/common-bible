name: Change ledger

# 변경 원장 게이트 — 모든 PR 은 docs/changes/ 에 새 원장 파일 하나를 포함해야 한다
# (형식·규칙: docs/changes/README.md). .claude/hooks/pre-pr-ledger.sh 가 Claude Code
# 안에서 같은 검사를 먼저 하지만, 터미널에서 직접 만든 PR 까지 잡는 건 이 잡이다.
# 브랜치 보호의 필수 검사에 "Change ledger" 를 넣어야 실제로 머지를 막는다.
# sync-data.yml 의 자동 PR(sync/ 브랜치)은 면제 — 잡은 돌되 바로 통과시킨다
# (skip 하면 필수 검사가 "대기" 로 남아 auto-merge 가 막힌다).
on:
  pull_request:
    branches: [main]

jobs:
  ledger:
    name: Change ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 원장 파일 검사
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in sync/*) echo "자동 PR — 면제"; exit 0 ;; esac
          base="origin/$BASE_REF"
          added=$(git diff --name-only --diff-filter=A "$base...HEAD" -- 'docs/changes/*.md' | grep -v '/README\.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::docs/changes/ 에 이 PR 의 원장 파일이 없습니다. 형식은 docs/changes/README.md"
            exit 1
          fi
          echo "원장: $added"
          for f in $added; do
            grep -qE '^title: ' "$f" || { echo "::error file=$f::frontmatter title: 없음"; exit 1; }
            grep -qE '^## 요약' "$f"  || { echo "::error file=$f::'## 요약' 절 없음"; exit 1; }
          done
          if git diff --name-only "$base...HEAD" | grep -qE '^(js/|css/|index\.html|sw\.js)'; then
            for f in $added; do
              awk '/^## 갱신한 문서/{s=1;next} /^## /{s=0} s && /^- /{found=1} END{exit !found}' "$f" \
                || { echo "::error file=$f::코드가 바뀐 PR — '## 갱신한 문서' 절에 항목이 필요합니다('- 없음 — 이유' 도 가능)"; exit 1; }
            done
          fi
