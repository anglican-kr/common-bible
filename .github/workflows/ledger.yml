name: Change ledger

# 변경 원장 게이트 — 모든 PR 은 docs/changes/ 에 새 원장 파일 하나를 포함해야 한다
# (형식·규칙: docs/changes/README.md). .claude/hooks/pre-pr-ledger.sh 가 Claude Code
# 안에서 같은 검사를 먼저 하지만, 터미널에서 직접 만든 PR 까지 잡는 건 이 잡이다.
# 브랜치 보호의 필수 검사에 "Change ledger" 를 넣어야 실제로 머지를 막는다.
# sync-data.yml 의 자동 PR(sync/ 브랜치)은 면제 — 잡은 돌되 바로 통과시킨다
# (skip 하면 필수 검사가 "대기" 로 남아 auto-merge 가 막힌다).
# 머지된 원장 불변 — base 에 이미 있는 docs/changes/*.md(README.md 제외)에 PR 이 손대면 실패한다.
# 짝은 .claude/hooks/pre-commit-ledger.sh(커밋 단계에서 같은 검사).
on:
  pull_request:
    branches: [main]

jobs:
  ledger:
    name: Change ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 원장 파일 검사
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in sync/*) echo "자동 PR — 면제"; exit 0 ;; esac
          base="origin/$BASE_REF"
          # 머지된 원장 불변 — base 에 이미 있는 원장(README.md 제외)에 손대면 실패.
          # 상태가 A(추가)·C(복사 — 원본은 건드리지 않는다)가 **아니면** 전부 위반으로 본다: M/D/R 은
          # 물론 T(원장을 심볼릭 링크로 바꿔치기)도 잡히고, git 이 새 상태 문자를 내도 기본이 「막음」이다.
          # R/C 행은 "R100<TAB>old<TAB>new" — $2 가 base 쪽 경로.
          # 이 PR 이 추가한 원장에 훅(post-pr-ledger.sh)이 `pr: N` 을 적는 후속 커밋은 base 에 없는
          # 파일이라 merge-base 대비 diff 에서 A 로 잡히므로 걸리지 않는다.
          # 아래 「원장 추가」 검사보다 **먼저** 둔다 — 머지된 원장을 지우고 새 원장을 추가하면 git 의
          # rename 탐지가 둘을 R 한 줄로 합쳐 --diff-filter=A 가 비므로, 순서가 반대면 정작 원장을
          # 추가한 작성자에게 「원장이 없다」는 엉뚱한 오류가 먼저 나간다.
          touched=$(git diff --name-status "$base...HEAD" -- 'docs/changes/*.md' | awk -F'\t' 'NF && $1 !~ /^[AC]/ {print $2}' | grep -v '/README\.md$' || true)
          if [ -n "$touched" ]; then
            echo "::error::머지된 원장은 고치지 않습니다: $(echo $touched) — 사실이 바뀌면 새 변경의 원장에 적고 정리 층 문서를 갱신하세요(docs/changes/README.md 규칙). 머지된 PR 을 되돌릴 때도 원장은 남기고 되돌림을 새 원장에 적습니다"
            exit 1
          fi
          echo "머지된 원장 수정 없음"
          added=$(git diff --name-only --diff-filter=A "$base...HEAD" -- 'docs/changes/*.md' | grep -v '/README\.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::docs/changes/ 에 이 PR 의 원장 파일이 없습니다. 형식은 docs/changes/README.md"
            exit 1
          fi
          echo "원장 후보:"; printf '  %s\n' $added
          code=0
          if git diff --name-only "$base...HEAD" | grep -qE '^(js/|css/|index\.html|sw\.js)'; then code=1; fi
          # 추가된 원장 중 하나 이상이 형식을 만족하면 통과 (소급 기록처럼 여러 파일이 함께 들어와도 됨).
          ok=0
          for f in $added; do
            grep -qE '^title: ' "$f" || { echo "  $f: frontmatter title: 없음"; continue; }
            grep -qE '^## 요약' "$f"  || { echo "  $f: '## 요약' 절 없음"; continue; }
            if [ "$code" = 1 ]; then
              awk '/^## 갱신한 문서/{s=1;next} /^## /{s=0} s && /^- /{found=1} END{exit !found}' "$f" \
                || { echo "  $f: 코드가 바뀐 PR — '## 갱신한 문서' 절에 항목이 없음"; continue; }
            fi
            echo "  $f: OK"; ok=1
          done
          if [ "$ok" = 0 ]; then
            echo "::error::형식을 만족하는 원장 파일이 없습니다 — title: · '## 요약' · (코드 변경 시) '## 갱신한 문서' 항목. 형식은 docs/changes/README.md"
            exit 1
          fi
